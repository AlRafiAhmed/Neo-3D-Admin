<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Profile - NEO3D</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/styles.css">
  <script>
    // Improved dark/light mode preference handler
    document.addEventListener("DOMContentLoaded", function () {
      const html = document.documentElement;
      const modeToggleBtn = document.getElementById("modeToggleBtn");

      // Set mode from localStorage or prefers-color-scheme
      if(localStorage.getItem("theme") === "dark" ||
        (!localStorage.getItem("theme") && window.matchMedia('(prefers-color-scheme: dark)').matches)
      ){
        html.classList.add("dark");
      } else {
        html.classList.remove("dark");
      }

      function toggleMode() {
        if(html.classList.contains("dark")) {
          html.classList.remove("dark");
          localStorage.setItem("theme", "light");
        } else {
          html.classList.add("dark");
          localStorage.setItem("theme", "dark");
        }
      }

      if(modeToggleBtn) {
        modeToggleBtn.addEventListener("click", toggleMode);
      }
    });
  </script>
</head>
<body data-page="admin-profile" class="min-h-screen transition-colors duration-300 bg-white text-neutral-900 dark:bg-[#18181b] dark:text-neutral-100">
