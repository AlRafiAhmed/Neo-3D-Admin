<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>View Orders - NEO3D</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="orders" class="min-h-screen bg-slate-100">
  <div class="flex min-h-screen flex-col md:flex-row">
    <div id="neoNavBackdrop" class="neo-nav-backdrop fixed inset-0 z-40 bg-slate-900/50 md:hidden" aria-hidden="true"></div>

    <header class="sticky top-0 z-30 flex shrink-0 items-center justify-between gap-2 bg-slate-900 px-4 py-3 text-white shadow-md md:hidden">
      <a href="dashboard.html" class="text-lg font-extrabold tracking-tight">NEO3D</a>
      <button type="button" id="neoNavToggle" class="rounded-lg bg-slate-800 p-2 text-white hover:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-sky-400" aria-label="Open menu" aria-expanded="false" aria-controls="neoSidebar">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>
    </header>

    <aside id="neoSidebar" class="neo-app-sidebar fixed left-0 top-0 z-50 flex min-h-[100dvh] w-64 max-w-[min(18rem,calc(100vw-1rem))] flex-col overflow-y-auto bg-slate-900 p-5 text-white shadow-2xl md:static md:z-auto md:min-h-screen md:w-64 md:max-w-none md:shrink-0 md:shadow-none" aria-label="Main navigation">
      <div class="mb-6 flex items-center justify-between gap-2">
        <h2 class="text-xl font-extrabold sm:text-2xl">NEO3D</h2>
        <button type="button" id="neoNavClose" class="rounded-lg bg-slate-800 p-2 text-white hover:bg-slate-700 md:hidden focus:outline-none focus:ring-2 focus:ring-sky-400" aria-label="Close menu">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
      <nav class="flex flex-1 flex-col gap-0.5">
        <a class="sidebar-link" href="admin-profile.html">Admin Profile</a>
        <a class="sidebar-link" href="dashboard.html">Dashboard</a>
        <a class="sidebar-link" href="create-order.html">Create Order</a>
        <a class="sidebar-link active" href="orders.html">View Orders</a>
        <a class="sidebar-link" href="profit.html">Profit</a>
        <a class="sidebar-link" href="login.html">Logout</a>
        
      </nav>
    </aside>

    <main class="min-w-0 flex-1 p-4 sm:p-5 md:p-8">
      <h1 class="mb-4 text-2xl font-bold sm:text-3xl">All Orders</h1>
      <div class="neo-card mb-4 flex flex-col gap-3 bg-white p-4 sm:flex-row sm:flex-wrap sm:items-end">
        <div class="min-w-0 flex-1 sm:flex-initial sm:min-w-[10rem]">
          <label class="mb-1 block text-sm font-semibold">Status</label>
          <select id="statusFilter" class="w-full rounded-lg border p-2.5">
            <option value="">All</option>
            <option value="Pending">Pending</option>
            <option value="Delivered">Delivered</option>
            <option value="Cancelled">Cancelled</option>
          </select>
        </div>
        <div class="min-w-0 flex-1 sm:flex-initial sm:min-w-[10rem]">
          <label class="mb-1 block text-sm font-semibold">Delivery Date</label>
          <input id="dateFilter" type="date" class="w-full rounded-lg border p-2.5">
        </div>
        <div class="min-w-0 flex-1 sm:flex-initial sm:min-w-[12rem]">
          <label class="mb-1 block text-sm font-semibold">Search Customer</label>
          <input id="ordersCustomer" placeholder="Customer name" class="w-full rounded-lg border p-2.5" />
        </div>
        <div class="min-w-0 flex-1 sm:flex-initial sm:min-w-[12rem]">
          <label class="mb-1 block text-sm font-semibold">Search Product</label>
          <input id="ordersProduct" placeholder="Product name" class="w-full rounded-lg border p-2.5" />
        </div>
      </div>

      <div class="neo-card neo-table-scroll overflow-x-auto bg-white">
        <table class="w-full min-w-[720px] text-sm">
          <thead class="bg-slate-100">
            <tr>
              <th class="px-3 py-2 text-left">SL</th>
              <th class="px-3 py-2 text-left">Order ID</th>
              <th class="px-3 py-2 text-left">Customer</th>
              <th class="px-3 py-2 text-left">Product</th>
              <th class="px-3 py-2 text-left">Qty</th>
              <th class="px-3 py-2 text-left">Price</th>
              <th class="px-3 py-2 text-left">Profit</th>
              <th class="px-3 py-2 text-left">Status</th>
              <th class="px-3 py-2 text-left">Delivery Date</th>
              <th class="px-3 py-2 text-left">Actions</th>
            </tr>
          </thead>
          <tbody id="ordersTableBody"></tbody>
        </table>
      </div>

      <div class="mt-4 flex flex-wrap items-center gap-2">
        <button type="button" id="prevPage" class="rounded-lg bg-slate-200 px-3 py-2 disabled:opacity-50">Prev</button>
        <button type="button" id="nextPage" class="rounded-lg bg-slate-200 px-3 py-2 disabled:opacity-50">Next</button>
        <span id="pager" class="text-sm text-slate-600"></span>
      </div>
    </main>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
